name: Recolha diaria BaZe

on:
  workflow_dispatch:

  schedule:
    - cron: "10 14 * * *"  # 15:10 em Portugal no horario de verao
    - cron: "10 15 * * *"  # 16:10 em Portugal no horario de verao
    - cron: "10 16 * * *"  # 17:10 em Portugal no horario de verao

permissions:
  contents: write

concurrency:
  group: recolha-baze
  cancel-in-progress: false

jobs:
  recolher-baze:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      PYTHONPATH: ${{ github.workspace }}/src

    steps:
      - name: Ir buscar o codigo
        uses: actions/checkout@v6

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apagar cache antiga do BaZe
        run: |
          mkdir -p results/energia/baze_cache
          rm -f results/energia/baze_cache/*.json
          mkdir -p results/agua/baze_cache
          rm -f results/agua/baze_cache/*.json

      - name: Recolher dados de energia e agua do BaZe
        id: recolha
        shell: bash
        run: |
          set +e

          echo "A recolher dados de energia..."
          python src/energia/realtime/detetar_anomalias.py --modo baze
          energia_status=$?
          echo "energia_status=$energia_status" >> "$GITHUB_OUTPUT"

          echo ""
          echo "A recolher dados de agua..."
          python src/agua/realtime/detetar_anomalias.py --modo baze
          agua_status=$?
          echo "agua_status=$agua_status" >> "$GITHUB_OUTPUT"

          if [ "$energia_status" -ne 0 ]; then
            echo "::warning::A recolha de energia terminou com erro $energia_status."
          fi

          if [ "$agua_status" -ne 0 ]; then
            echo "::warning::A recolha de agua terminou com erro $agua_status."
          fi

          if [ "$energia_status" -ne 0 ] && [ "$agua_status" -ne 0 ]; then
            echo "::error::As duas recolhas falharam."
            exit 1
          fi

      - name: Guardar results como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-baze-${{ github.run_number }}
          path: |
            results/
            !results/energia/baze_cache/**
            !results/agua/baze_cache/**
          retention-days: 30

      - name: Guardar results no repositorio
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A results/

          if git diff --cached --quiet; then
            echo "Sem alteracoes em results/ para guardar."
            exit 0
          fi

          git commit -m "Atualizar results BaZe"
          git push
